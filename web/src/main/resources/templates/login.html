<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background: linear-gradient(to right, #800020, #b22234);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      display: flex;
      width: 90%;
      max-width: 1000px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .left-panel {
      width: 50%;
      position: relative;
      overflow: hidden;
      border-radius: 20px 0 0 20px;
    }

    .illustration {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('E:/Downloads/Semester 9/SDP/SDP project/charity_school/images/school2.jpg') center/cover;
      filter: brightness(1.2);
    }

    .right-panel {
      background: #fff;
      padding: 3rem;
      width: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 3rem;
    }

    .login-box h1 {
      font-size: 2rem;
      color: #800020;
      margin-bottom: 2rem;
      text-align: center;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 25px;
      border: 1px solid #800020;
      outline: none;
      background: #fff;
      color: #333;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .input-group .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #800020;
      font-size: 1.2rem;
    }

    .btn {
      width: 100%;
      padding: 1rem 0;
      background-color: #800020;
      color: #fff;
      border: none;
      border-radius: 25px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #b22234;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      font-size: 1rem;
    }

    .options a {
      color: #800020;
      text-decoration: none;
      transition: color 0.3s;
    }

    .options a:hover {
      color: #b22234;
    }

    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }

      .left-panel,
      .right-panel {
        width: 100%;
      }

      .left-panel {
        height: 200px;
        border-radius: 20px 20px 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="left-panel">
      <div class="illustration"></div>
    </div>
    <div class="right-panel">
      <div class="login-box">
        <h1>Login</h1>
        <form method="POST" action="/login">
          <div class="input-group">
            <input type="text" placeholder="Email" name="email" required>
          </div>
          <div class="input-group">
            <input
              type="password"
              id="password-field"
              placeholder="Password" name="password"
              required
            >
            <i class="toggle-password fas fa-eye" id="toggle-password"></i>
          </div>
          <button type="submit" class="btn">SIGN IN</button>
          <div class="options">
            <label>
              <input type="checkbox">
              Remember Me
            </label>
            <a href="#">Forgot Password</a>
          </div>
        </form>
        <p id="error-message" style="color:red;"></p>
      </div>
    </div>
  </div>

  <script>
    const passwordField = document.getElementById('password-field');
    const togglePassword = document.getElementById('toggle-password');

    togglePassword.addEventListener('click', () => {
      const type = passwordField.type === 'password' ? 'text' : 'password';
      passwordField.type = type;
      togglePassword.classList.toggle('fa-eye');
      togglePassword.classList.toggle('fa-eye-slash');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background: url('E:/Downloads/Semester 9/SDP/SDP project/charity_school/images/school.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.03);
      padding: 2rem;
      border-radius: 10px;
      box-shadow: black;
      border-style: solid;
      backdrop-filter: blur(10px);
      text-align: center;
      color: #fff;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 25px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .input-group .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #fff;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.8rem 0;
      background-color: #f9c2c2;
      color: #fff;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #f78b8b;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .options a {
      color: #fff;
      text-decoration: none;
      transition: color 0.3s;
    }

    .options a:hover {
      color: #f9c2c2;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Welcome Back!</h1>
      <form>
        <div class="input-group">
          <input type="text" placeholder="Username" required>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" required>
          <span class="toggle-password">👁</span>
        </div>
        <button type="submit" class="btn">SIGN IN</button>
        <div class="options">
          <label>
            <input type="checkbox">
            Remember Me
          </label>
          <a href="#">Forgot Password</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Advertisement</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }

        header {
            background-color: #800020;
            color: #fff;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #800020;
            font-size: 22px;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }

        input, select, textarea {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #800020;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #a62940;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #800020;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header>Create Advertisement</header>

<div class="container">
    <h1>Create a New Advertisement</h1>
    <form method="post" action="/create-advertisement">
        <div>
            <label for="content">Advertisement Content</label>
            <textarea id="content" name="content" rows="3" placeholder="Enter advertisement content" required></textarea>
        </div>
    
        <div>
            <label for="platform">Select Platform</label>
            <select id="platform" name="platform" required>
                <option value="" disabled selected>Select a platform</option>
                <option value="Twitter">Twitter</option>
                <option value="Facebook">Facebook</option>
                <option value="Instagram">Instagram</option>
            </select>
        </div>
    
        <div>
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="" disabled selected>Select status</option>
                <option value="Upcoming">Upcoming</option>
                <option value="Running">Running</option>
                <option value="Paused">Paused</option>
            </select>
        </div>
    
        <div>
            <label for="launchDate">Launch Date</label>
            <input type="datetime-local" id="launchDate" name="launchDate" required>
        </div>
    
        <div>
            <label for="event">Select Event</label>
            <select id="event" name="event" required>
                <option value="" disabled selected>Select an event</option>
                <!-- This will iterate over the events from EventController.createdEvents -->
                <option th:each="event : ${events}" 
                        th:value="${event.id}" 
                        th:text="${event.name}">
                </option>
            </select>
        </div>
    
        <button type="submit">Create Advertisement</button>
    </form>
    
    
    <div class="back-link">
        <a href="/admin-dashboard">← Back to Admin Dashboard</a>
    </div>
</div>

</body>
</html>

 <!DOCTYPE html>
 <html lang="en">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Signup Page</title>
   <link
     rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
   />
   <style>
     * {
       margin: 0;
       padding: 0;
       box-sizing: border-box;
       font-family: 'Arial', sans-serif;
     }
 
     body {
       background: linear-gradient(to right, #800020, #b22234);
       height: 100vh;
       display: flex;
       justify-content: center;
       align-items: center;
     }
 
     .signup-container {
       display: flex;
       width: 90%;
       max-width: 1000px;
       background: #fff;
       border-radius: 20px;
       overflow: hidden;
       box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
     }
 
     .left-panel {
       width: 50%;
       position: relative;
       overflow: hidden;
       border-radius: 20px 0 0 20px;
     }
 
     .illustration {
       position: absolute;
       top: 0;
       left: 0;
       width: 100%;
       height: 100%;
       background: url('/images/school3.jpeg') center/cover;
       filter: brightness(1.2);
     }
 
     .right-panel {
       background: #fff;
       padding: 3rem;
       width: 50%;
       display: flex;
       flex-direction: column;
       justify-content: center;
     }
 
     .signup-box {
       width: 100%;
       max-width: 400px;
       margin: 0 auto;
     }
 
     .signup-box h1 {
       font-size: 2rem;
       color: #800020;
       margin-bottom: 2rem;
       text-align: center;
     }
 
     .input-group {
       position: relative;
       margin-bottom: 1.5rem;
     }
 
     .input-group input,
     .input-group select {
       width: 100%;
       padding: 0.9rem 1rem;
       border-radius: 25px;
       border: 1px solid #800020;
       outline: none;
       background: #fff;
       color: #333;
       font-size: 1rem;
       transition: all 0.3s ease;
     }
 
     .toggle-password {
       position: absolute;
       right: 15px;
       top: 50%;
       transform: translateY(-50%);
       cursor: pointer;
       color: #800020;
       font-size: 1.2rem;
     }
 
     .btn {
       width: 100%;
       padding: 1rem 0;
       background-color: #800020;
       color: #fff;
       border: none;
       border-radius: 25px;
       font-size: 1.1rem;
       cursor: pointer;
       transition: background-color 0.3s;
     }
 
     .btn:hover {
       background-color: #b22234;
     }
 
     .popup {
       position: fixed;
       top: 50%;
       left: 50%;
       transform: translate(-50%, -50%);
       background: #fff;
       border-radius: 10px;
       box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
       padding: 20px 40px;
       text-align: center;
       z-index: 1000;
       display: none;
     }
 
     .popup h2 {
       color: #800020;
       font-size: 1.5rem;
       margin-bottom: 15px;
     }
 
     .popup button {
       padding: 10px 20px;
       background-color: #800020;
       color: #fff;
       border: none;
       border-radius: 5px;
       cursor: pointer;
       font-size: 1rem;
     }
 
     .popup button:hover {
       background-color: #b22234;
     }
 
     .hidden {
       display: none;
     }
 
     .popup-overlay {
       position: fixed;
       top: 0;
       left: 0;
       width: 100%;
       height: 100%;
       background: rgba(0, 0, 0, 0.5);
       z-index: 999;
       display: none;
     }
     .input-group select[multiple] {
    height: auto;
    min-height: 120px;
    padding: 8px;
}

.input-group select[multiple] option {
    padding: 6px;
    margin: 2px 0;
    border-radius: 4px;
}

.input-group select[multiple] option:checked {
    background-color: #800020;
    color: white;
}
 
     .error-message {
       color: #ff0000;
       font-size: 0.9rem;
       margin-top: 0.5rem;
       text-align: center;
       display: none;
     }
 
     @media (max-width: 768px) {
       .signup-container {
         flex-direction: column;
       }
 
       .left-panel,
       .right-panel {
         width: 100%;
       }
 
       .left-panel {
         height: 200px;
         border-radius: 20px 20px 0 0;
       }
     }
   </style>
 </head>
 <body>
   <div class="signup-container">
     <div class="left-panel">
       <div class="illustration"></div>
     </div>
     <div class="right-panel">
       <div class="signup-box">
         <h1>Create an Account</h1>
         <form id="signupForm" action="/signup" method="post">
           <div class="input-group">
             <input type="text" name="name" placeholder="Name" required>
           </div>
           <div class="input-group">
             <input type="email" name="email" placeholder="Email" required>
           </div>
           <div class="input-group">
             <input type="password" id="password" name="password" placeholder="Password" required>
             <i class="toggle-password fas fa-eye" id="toggle-password"></i>
           </div>
           <div class="input-group">
             <select name="role" id="role" required>
               <option value="" disabled selected>Select Role</option>
               <option value="volunteer">Volunteer</option>
               <option value="donor">Donor</option>
             </select>
           </div>
 
           <!-- Volunteer-specific fields -->
           <div id="volunteer-fields" class="hidden">
             <div class="input-group">
               <select name="skills" id="skills" multiple required>
                 <option value="teaching">Teaching</option>
                 <option value="counseling">Counseling</option>
                 <option value="organizing">Organizing</option>
                 <option value="technical">Technical Support</option>
               </select>
             </div>
             <div class="input-group">
               <select name="availability" required>
                 <option value="" disabled selected>Availability</option>
                 <option value="true">Yes</option>
                 <option value="false">No</option>
               </select>
             </div>
           </div>
 
           <!-- Donor-specific fields -->
           <div id="donor-fields" class="hidden">
             <div class="input-group">
               <select name="preferred_type" required>
                 <option value="" disabled selected>Preferred Type</option>
                 <option value="one-time">One-Time</option>
                 <option value="monthly">Monthly</option>
                 <option value="annually">Annually</option>
                 <option value="none">None</option>
               </select>
             </div>
           </div>
 
           <div class="error-message" id="errorMessage"></div>
           <button type="submit" class="btn">SIGN UP</button>
         </form>
       </div>
     </div>
   </div>
 
   <div class="popup-overlay" id="popupOverlay"></div>
   <div class="popup" id="popup">
     <h2>Signup Successful!</h2>
     <button onclick="closePopup()">OK</button>
   </div>
 
   <script>
     // Password toggle functionality
     const togglePassword = document.getElementById('toggle-password');
     const passwordField = document.getElementById('password');
     const signupForm = document.getElementById('signupForm');
     const popup = document.getElementById('popup');
     const popupOverlay = document.getElementById('popupOverlay');
     const errorMessage = document.getElementById('errorMessage');
 
     togglePassword.addEventListener('click', () => {
       const type = passwordField.type === 'password' ? 'text' : 'password';
       passwordField.type = type;
       togglePassword.classList.toggle('fa-eye');
       togglePassword.classList.toggle('fa-eye-slash');
     });
 
     // Role selection handling
     document.getElementById('role').addEventListener('change', function() {
       const volunteerFields = document.getElementById('volunteer-fields');
       const donorFields = document.getElementById('donor-fields');
       
       // Reset required attributes
       const volunteerSelects = volunteerFields.querySelectorAll('select');
       const donorSelects = donorFields.querySelectorAll('select');
       
       volunteerSelects.forEach(select => select.required = false);
       donorSelects.forEach(select => select.required = false);
 
       if (this.value === 'volunteer') {
         volunteerFields.classList.remove('hidden');
         donorFields.classList.add('hidden');
         volunteerSelects.forEach(select => select.required = true);
       } else if (this.value === 'donor') {
         donorFields.classList.remove('hidden');
         volunteerFields.classList.add('hidden');
         donorSelects.forEach(select => select.required = true);
       }
     });
 
     // Form submission handling
     signupForm.addEventListener('submit', async (event) => {
       event.preventDefault();
       errorMessage.style.display = 'none';
 
       try {
         const formData = new FormData(signupForm);
         const response = await fetch('/signup', {
           method: 'POST',
           body: formData
         });
 
         if (response.ok) {
           popup.style.display = 'block';
           popupOverlay.style.display = 'block';
         } else {
           const errorData = await response.json();
           errorMessage.textContent = errorData.message || 'Signup failed. Please try again.';
           errorMessage.style.display = 'block';
         }
       } catch (error) {
         console.error('Error:', error);
         errorMessage.textContent = 'An error occurred. Please try again.';
         errorMessage.style.display = 'block';
       }
     });
 
     // Popup handling
     function closePopup() {
       popup.style.display = 'none';
       popupOverlay.style.display = 'none';
       signupForm.submit();
     }
   </script>
 </body>
 </html>

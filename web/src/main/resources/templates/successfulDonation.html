<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            margin: 50px auto;
            padding: 20px;
            max-width: 600px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #800020;
        }
        p {
            font-size: 18px;
            color: #333;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #800020; /* Primary color */
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background: #a0002b; /* Hover color */
        }
        .rbtn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;  /* Increased padding for larger button */
            background: #747d71; /* Grey color */
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
            font-size: 18px; 
        }
        .rbtn:hover {
            background: #5a6b5a; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thank You for Your Donation!</h1>
        <p>Your donation was successful.</p>
        <p><strong>Amount:</strong> <span th:text="${lastDonation.amount}"></span></p>
        <p><strong>Payment Method:</strong> <span th:text="${lastDonation.payment}"></span></p>
        <p><strong>Date:</strong> <span th:text="${lastDonation.formattedDate}"></span></p>
        <a href="/donate" class="btn">Make Another Donation</a>
        <a href="/donation_history" class="btn">View Donation History</a>
        
        <div class="button-group">
            <form th:action="@{/refund}" method="post">
                <button class="rbtn" type="submit">Refund Last Donation</button>
            </form>
        </div>
    </div>
</body>
</html>

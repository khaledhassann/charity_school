<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: white;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: 600;
            width: 100%;
        }

        footer {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            width: 100%;
            margin-top: auto;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 10px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
            border: 2px solid #800020;
        }

        h1 {
            font-size: 22px;
            color: #800020;
            text-align: center;
            margin-bottom: 15px;
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group input,
        .input-group select {
            width: 85%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #800020;
            border-radius: 25px;
            outline: none;
            background: #f9f9f9;
            margin: 0 auto;
            display: block;
        }

        button {
            background: #800020;
            color: #fff;
            border: none;
            padding: 12px 0;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background: #a62940;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: #800020;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #a62940;
        }

        .popup-message {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            animation: fadeOut 3s ease-in-out forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            80% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                display: none;
            }
        }
    </style>
</head>
<body>
<header>Create Room</header>
<div class="container">
    <h1>Create a New Room</h1>

    <!-- Success Popup -->
    <div id="successMessage" th:if="${message}" class="popup-message">
        <p th:text="${message}"></p>
    </div>

    <form method="post" action="/create-room">
        <div class="input-group">
            <input type="text" name="name" placeholder="Room Name" required>
        </div>
        <div class="input-group">
            <input type="number" name="capacity" placeholder="Capacity" required>
        </div>
        <div class="input-group">
            <select name="amendment">
                <option value="" disabled selected>Select an Amendment</option>
                <option value="Projector">Projector</option>
                <option value="Smartboard">Smartboard</option>
                <option value="Chairs">Chairs</option>
            </select>
        </div>
        <button type="submit">Create Room</button>
    </form>    
    <a href="/admin-dashboard" class="back-link">← Back to Admin Dashboard</a>
</div>
<footer>&copy; 2025 Hope Haven School. All rights reserved.</footer>
</body>
</html>

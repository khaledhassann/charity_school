<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: white;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: 600;
            width: 100%;
        }

        footer {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            width: 100%;
            margin-top: auto;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 10px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
            border: 2px solid #800020;
        }

        h1 {
            font-size: 22px;
            color: #800020;
            text-align: center;
            margin-bottom: 15px;
        }

        label {
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        select, input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #800020;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        button {
            background: #800020;
            color: #fff;
            border: none;
            padding: 12px 0;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background: #a62940;
        }

        .message {
            color: green;
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
        }

        .popup-message {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            animation: fadeOut 3s ease-in-out forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            80% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                display: none;
            }
        }

        #chairsInput {
            display: none;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: #800020;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #a62940;
        }
    </style>
</head>
<body>
<header>Upgrade Room</header>
<div class="container">
    <h1>Upgrade a Room</h1>

    <!-- Success Popup -->
    <div id="successMessage" th:if="${message}" class="popup-message">
        <p th:text="${message}"></p>
    </div>

    <!-- Fallback for No Rooms -->
    <div th:if="${rooms.isEmpty()}">
        <p>No rooms available. Please create a room first.</p>
    </div>

    <!-- Form to Upgrade Room -->
    <form th:if="${not rooms.isEmpty()}" th:action="@{/upgrade-room}" method="post">
        <label for="room">Select Room:</label>
        <select id="room" name="room" required>
            <option value="" disabled selected>Select a room</option>
            <option th:each="room : ${rooms}" th:value="${room.name}" th:text="${room.name}"></option>
        </select>

        <label for="amendment">Select Amendment:</label>
        <select id="amendment" name="amendment" required onchange="toggleChairsInput(this.value)">
            <option value="" disabled selected>Select an amendment</option>
            <option th:each="amendment : ${amendments}" 
                    th:value="${amendment}" 
                    th:disabled="${selectedRoom != null and selectedRoom.amendments.contains(amendment)}" 
                    th:text="${amendment}"></option>
        </select>

        <!-- Input for Chairs -->
        <div id="chairsInput">
            <label for="chairsNumber">Number of Chairs:</label>
            <input type="number" id="chairsNumber" name="chairsNumber" placeholder="Enter number of chairs">
        </div>

        <button type="submit">Upgrade Room</button>
    </form>
    <a href="/admin" class="back-link">← Back to Admin Dashboard</a>
</div>

<footer>&copy; 2025 Hope Haven School. All rights reserved.</footer>

<script>
    function toggleChairsInput(selectedValue) {
        const chairsInput = document.getElementById("chairsInput");
        if (selectedValue === "Chairs") {
            chairsInput.style.display = "block";
        } else {
            chairsInput.style.display = "none";
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #f5f5f5, #e8e8e8);
            color: #333;
        }

        header {
            background: linear-gradient(to right, #800020, #a62940);
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-size: 28px;
            font-weight: 700;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #ffcccc;
        }

        .schedule-section {
            padding: 40px 20px;
        }

        .schedule-section h2 {
            text-align: center;
            font-size: 32px;
            color: #800020;
            margin-bottom: 30px;
        }

        .schedule-table {
            width: 90%;
            margin: 0 auto;
            border-collapse: collapse;
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .schedule-table th,
        .schedule-table td {
            border: none;
            padding: 15px;
            text-align: center;
            font-size: 16px;
        }

        .schedule-table th {
            background: #800020;
            color: #fff;
            font-weight: 600;
            font-size: 18px;
        }

        .schedule-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .schedule-table tr:nth-child(odd) {
            background: #fefefe;
        }

        .schedule-table tr:hover {
            background: #ffe6e6;
        }

        .schedule-table td {
            font-size: 16px;
            color: #555;
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Hope Haven School</div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="schedule-section">
        <h2>Your Schedule</h2>
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Time Slot</th>
                    <th>Course</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${scheduleEntries}">
                    <td th:text="${entry.day}"></td>
                    <td th:text="${entry.timeSlot}"></td>
                    <td th:text="${entry.course}"></td>
                    <td th:text="${entry.location}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer>
        <p>&copy; 2025 Hope Haven School. All rights reserved.</p>
    </footer>
</body>
</html>

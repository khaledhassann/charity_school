<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Beneficiary</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: white;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            background: #7a001e;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            font-size: 24px;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
        }

        .header-title {
            display: flex;
            align-items: center;
        }

        .beneficiaries-container {
            position: relative;
            margin: 0;
        }

        .dropdown-btn {
            background-color: #fff;
            color: #7a001e;
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.3s ease;
        }

        .dropdown-btn:hover {
            background-color: #a62940;
            color: #fff;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #7d7676;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 200px;
            z-index: 10;
        }

        .dropdown-content ul {
            list-style: none;
            padding: 10px;
            margin: 0;
        }

        .dropdown-content li {
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .dropdown-content li:last-child {
            border-bottom: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 10px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
            border: 2px solid #800020;
            text-align: center; /* Center the form content */
        }

        footer {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            width: 100%;
            margin-top: auto;
        }
        .popup-message {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            animation: fadeOut 3s ease-in-out forwards;
        }
        @keyframes fadeOut {
        0% {
            opacity: 1;
        }
        80% {
            opacity: 0.5;
        }
        100% {
            opacity: 0;
            display: none;
        }
    }

        h1 {
            font-size: 22px;
            color: #800020;
            text-align: center;
            margin-bottom: 15px;
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group input, .input-group select {
            width: 85%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #800020;
            border-radius: 25px;
            outline: none;
            background: #f9f9f9;
            margin: 0 auto;
            display: block;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #a62940;
        }
        .password-toggle {
            position: absolute;
            right: 31px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            color: #800020;
        }
        button {
            background: #800020;
            color: #fff;
            border: none;
            padding: 12px 0;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background: #a62940;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: #800020;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #a62940;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">Register Beneficiary</div>
        <div class="beneficiaries-container">
            <button class="dropdown-btn" onclick="toggleDropdown()">List of Beneficiaries <i class="fa fa-chevron-down"></i></button>
            <div id="dropdownContent" class="dropdown-content">
                <ul>
                    <li th:each="beneficiary : ${beneficiaries}">
                        <span th:text="${beneficiary.name}">Beneficiary Name</span> - Grade: <span th:text="${beneficiary.grade}">Grade</span>
                    </li>
                </ul>
            </div>
        </div>
    </header>
    <div class="container">
        <h1>Register a New Beneficiary</h1>
         <!-- Success Popup -->
    <div id="successMessage" th:if="${message}" class="popup-message">
        <p th:text="${message}"></p>
    </div>

        <form method="post" action="/register-beneficiary">
            <div class="input-group">
                <input type="text" name="name" placeholder="Name" required>
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" id="password" required>
                <i class="fa fa-eye password-toggle" id="toggle-password" onclick="togglePassword('password', 'toggle-password')"></i>
            </div>
            <div class="input-group">
                <!-- <label for="grade">Grade</label> -->
            <select id="grade" name="grade" required>
                <option value="" disabled selected>Select Grade</option>
                <option value="1">Grade 1</option>
                <option value="2">Grade 2</option>
                <option value="3">Grade 3</option>
                <option value="4">Grade 4</option>
                <option value="5">Grade 5</option>
                <option value="6">Grade 6</option>
                <option value="7">Grade 7</option>
                <option value="8">Grade 8</option>
                <option value="9">Grade 9</option>
                <option value="10">Grade 10</option>
                <option value="11">Grade 11</option>
                <option value="12">Grade 12</option>
            </select>
            </div>
            <div class="input-group">
                <label for="enrollmentDate">Enrollment Date</label>
                <input type="datetime-local" name="enrollmentDate" id="enrollmentDate" required>
            </div>
            <button type="submit">Register Beneficiary</button>
        </form>
        <a href="/admin" class="back-link">&larr; Back to Admin Dashboard</a>
    </div>
    <footer>&copy; 2025 Hope Haven School. All rights reserved.</footer>
    <script>
        function togglePassword(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);
            if (input.type === 'password') {
                input.type = 'text';
                toggle.classList.remove('fa-eye');
                toggle.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                toggle.classList.remove('fa-eye-slash');
                toggle.classList.add('fa-eye');
            }
        }

        function toggleDropdown() {
            const dropdownContent = document.getElementById('dropdownContent');
            dropdownContent.style.display = dropdownContent.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>

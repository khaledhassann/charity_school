<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #f5f5f5, #e8e8e8);
            color: #333;
        }

        header {
            background: linear-gradient(to right, #800020, #a62940);
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-size: 28px;
            font-weight: 700;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #ffcccc;
        }

        .events-section {
            padding: 40px 20px;
            text-align: center;
        }

        .events-section h1 {
            font-size: 36px;
            color: #800020;
            margin-bottom: 30px;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 22px;
            color: #800020;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
        }

        .card .event-date, .card .event-location {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .card button {
            background: linear-gradient(to right, #800020, #a62940);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .card button:hover {
            background: linear-gradient(to right, #a62940, #800020);
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Hope Haven School</div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/register-courses">Courses</a></li>
                <li><a href="/registered-courses">Registered Courses</a></li>
                <li><a href="/events">Events</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="events-section">
        <h1>All Events</h1>
        <div class="card-container">
            <!-- Dynamic rendering of events -->
            <div th:each="event : ${events}" class="card">
                <img th:src="@{${event.imageUrl}}" alt="Event Image">
                <h3 th:text="${event.name}"></h3>
                <p th:text="${event.description}"></p>
                <p class="event-date">Date: <span th:text="${event.date}"></span></p>
                <p class="event-location">Location: <span th:text="${event.location}"></span></p>
                <button>Learn More</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Hope Haven School. All rights reserved.</p>
    </footer>
</body>
</html>

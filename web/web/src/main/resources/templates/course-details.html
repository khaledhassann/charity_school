<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(to right, #f5f5f5, #e8e8e8);
        }

        header {
            background: linear-gradient(to right, #800020, #a62940);
            color: #fff;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header .logo {
            font-size: 28px;
            font-weight: 700;
        }

        .content {
            text-align: center;
            padding: 40px 20px;
        }

        .content h1 {
            font-size: 42px;
            color: #800020;
            margin-bottom: 20px;
        }

        .content img {
            width: 100%;
            max-width: 600px;
            height: auto;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .content p {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }

        .details {
            margin-bottom: 20px;
        }

        .assessments-button {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .assessments-button button {
            background: linear-gradient(to right, #800020, #a62940);
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .assessments-button button:hover {
            background: linear-gradient(to right, #a62940, #800020);
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Hope Haven School</div>
    </header>
    <div class="content">
        <h1 th:text="${course.name}"></h1>
        <img th:src="${course.imageUrl}" th:alt="${course.name}">
        <p th:text="${course.description}"></p>
        <div class="details">
            <p><strong>Credits:</strong> <span th:text="${course.credits}"></span></p>
            <p><strong>Time Slot:</strong> <span th:text="${course.timeSlot}"></span></p>
        </div>
    </div>
    <div class="assessments-button">
        <a th:href="@{/course-assessments(courseId=${course.id})}">
            <button>View Assessments</button>
        </a>
    </div>
    <footer>
        <p>&copy; 2025 Hope Haven School. All rights reserved.</p>
    </footer>
</body>
</html>

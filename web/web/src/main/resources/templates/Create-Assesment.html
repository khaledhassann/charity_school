<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assessment</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: white;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        header {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: 600;
            width: 100%;
        }

        footer {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            width: 100%;
            margin-top: auto;
        }

        .form-container {
            width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #800020;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #b22234;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: #800020;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #a62940;
        }
    </style>
</head>
<body>
    <header>Create Assessment</header>
    <div class="form-container">
        <h2>Create a New Assessment</h2>
        <form action="/create-assessment" method="post">
            <div class="form-group">
                <label for="name">Assessment Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="weight">Weight (%)</label>
                <input type="number" id="weight" name="weight" min="0" max="100" required>
            </div>
            <div class="form-group">
                <label for="maxScore">Max Score</label>
                <input type="number" id="maxScore" name="maxScore" required>
            </div>
            <div class="form-group">
                <label for="deadline">Deadline</label>
                <input type="datetime-local" id="deadline" name="deadline" required>
            </div>
            <div class="form-group">
                <label for="course">Course</label>
                <select name="courseId" id="course" required>
                    <option value="" disabled selected>Select a Course</option>
                    <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="state">Initial State</label>
                <select name="state" id="state" required>
                    <option value="Draft">Draft</option>
                    
                </select>
            </div>
            <button type="submit" class="btn">Create Assessment</button>
        </form>
        <a href="/taught-courses" class="back-link">← Back to Courses</a>
    </div>
    <footer>&copy; 2025 Hope Haven School. All rights reserved.</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Assessments</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(to right, #f5f5f5, #e8e8e8);
        }

        header {
            background: linear-gradient(to right, #800020, #a62940);
            color: #fff;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header .logo {
            font-size: 28px;
            font-weight: 700;
        }

        .content {
            text-align: center;
            padding: 40px 20px;
        }

        .content h1 {
            font-size: 42px;
            color: #800020;
            margin-bottom: 20px;
        }

        .assessments {
            margin-top: 40px;
            padding: 20px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: 40px auto;
        }

        .assessments h2 {
            font-size: 32px;
            color: #800020;
            margin-bottom: 20px;
            text-align: center;
        }

        .assessment-item {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #f9f9f9;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .assessment-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .assessment-item strong {
            font-size: 20px;
            color: #800020;
            display: block;
            margin-bottom: 5px;
        }

        .assessment-item p {
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Hope Haven School</div>
    </header>

    <div class="content">
        <h1 th:text="'Assessments for ' + ${course.name}"></h1>
        <div class="assessments">
            <h2>Assessments</h2>
            <div th:each="assessment : ${assessments}" class="assessment-item">
                <strong th:text="${assessment.name}"></strong>
                <p>Weight: <span th:text="${assessment.weight} + '%'"></span></p>
                <p>Max Score: <span th:text="${assessment.maxScore}"></span></p>
                <p>Deadline: <span th:text="${assessment.deadline}"></span></p>
                <p>State: <span th:text="${assessment.stateName}"></span></p>
            </div>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 Hope Haven School. All rights reserved.</p>
    </footer>

    <script>
        function changeState(assessmentId) {
            // Mock API call to change the state
            alert('State changed for Assessment ID: ' + assessmentId);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Assessments</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: white;
            color: #333;
        }

        header {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: 600;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
        }

        th {
            background: #800020;
            color: white;
        }

        .btn {
            padding: 5px 10px;
            background-color: #800020;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #b22234;
        }
    </style>
</head>
<body>
    <header>All Assessments</header>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Weight (%)</th>
                <th>Max Score</th>
                <th>Deadline</th>
                <th>State</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="assessment : ${assessments}">
                <td th:text="${assessment.name}"></td>
                <td th:text="${assessment.weight}"></td>
                <td th:text="${assessment.maxScore}"></td>
                <td th:text="${#temporals.format(assessment.deadline, 'yyyy-MM-dd HH:mm')}"></td>

                <td th:text="${assessment.state.toString()}"></td>
                <td>
                    <form action="/change-state" method="post">
                        <input type="hidden" name="assessmentName" th:value="${assessment.name}" />
                        <button type="submit">Change State</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>

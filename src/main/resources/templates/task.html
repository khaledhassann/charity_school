<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        header {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: 600;
            width: 100%;
        }
        .task-details {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 10px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border: 2px solid #800020;
        }
        h2 {
            font-size: 22px;
            color: #800020;
            text-align: center;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            color: #333;
            margin: 10px 0;
            font-weight: 500;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            font-size: 14px;
            color: #555;
            background: #f5f5f5;
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        footer {
            background: #7a001e;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            width: 100%;
            margin-top: auto;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: #800020;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #a62940;
        }
    </style>
</head>
<body>
    <header>Task Details</header>
    <div class="task-details">
        <h2 th:text="${task.name}">Task Name</h2>
        <p><strong>Skills Required:</strong></p>
        <ul>
            <li th:each="skill : ${task.skillsRequired}" th:text="${skill}"></li>
        </ul>
    </div>
    <footer>&copy; 2025 Hope Haven School. All rights reserved.</footer>
</body>
</html>
